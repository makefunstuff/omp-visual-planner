[package]
name = "diatui"
version = "0.1.0"
edition = "2021"
description = "Visual brainstorming board: boxes + links, exported as an LLM spec (terminal UI)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
