<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visual planner</title>
<style>
/* OpenCode DESIGN.md: one monospace face, cream canvas and near-black ink, 1px hairlines,
   4px radius on controls and 0 on containers, no shadows, ASCII markers, blue only for state. */
:root {
  --bg: #fdfcfc; --soft: #f8f7f7; --card: #f1eeee; --line: rgba(15,0,0,0.12); --line-strong: #646262;
  --text: #201d1d; --body: #424245; --muted: #646262; --faint: #9a9898;
  --ink: #201d1d; --ink-deep: #0f0000; --on-ink: #fdfcfc;
  --accent: #007aff; --accent-soft: rgba(0,122,255,0.08);
  --ok: #30d158; --warn: #cc7f08; --bad: #d70015;
  --mono: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #201d1d; --soft: #302c2c; --card: #302c2c; --line: rgba(253,252,252,0.12); --line-strong: #646262;
    --text: #fdfcfc; --body: #d9d6d6; --muted: #9a9898; --faint: #6e6e73;
    --ink: #fdfcfc; --ink-deep: #f1eeee; --on-ink: #201d1d;
    --accent-soft: rgba(0,122,255,0.16); --warn: #ff9f0a; --bad: #ff3b30;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.5 var(--mono); }
button { font: 500 13px/1.8 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 10px; cursor: pointer; }
button:active:not(:disabled) { background: var(--card); }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
button.danger { color: var(--bad); }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover:not(:disabled) { background: var(--soft); }
/* After the variants, so a disabled Save or Accept never looks pressable. */
button:disabled, button.primary:disabled { color: var(--faint); background: var(--card); border-color: var(--line); cursor: default; }
button.ghost:disabled { background: transparent; border-color: transparent; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, textarea, select { font: 13px/1.5 var(--mono); color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; width: 100%; }
input:focus, textarea:focus, select:focus { outline: none; background: var(--bg); border-color: var(--ink); }
textarea { resize: none; overflow: hidden; min-height: 2.9em; }

/* The canvas is the page. */
.viewport { position: fixed; inset: 0; overflow: hidden; cursor: default;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); }
.viewport.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
.edge-line { stroke: var(--line-strong); stroke-width: 1.25; fill: none; }
.edge-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.edge.selected .edge-line { stroke: var(--accent); stroke-width: 2; }
.edge-label { fill: var(--muted); font: 12px var(--mono); pointer-events: none; }
.edge-label-bg { fill: var(--bg); }
.wire { stroke: var(--accent); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }

/* Work at the level of a building block; the coordinate map is optional. The outline rail stays
   beside the page and the walk alike, so you always see where the focused block sits. */
.workspace { position: fixed; inset: var(--top) 0 var(--bottom); display: grid; grid-template-columns: minmax(210px, 25%) 1fr; background: var(--bg); }
.workspace .rail { border-right: 1px solid var(--line); overflow: auto; padding: 14px 10px 40px; }
.label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.rail > .label { padding: 0 8px 8px; }
.rail .row { display: flex; align-items: center; width: 100%; gap: 8px; text-align: left; border: 0; border-radius: 0; padding: 4px 8px; background: transparent; }
.rail .row:hover { background: var(--soft); }
.rail .row.current { color: var(--accent); background: var(--accent-soft); }
.rail .row.dim .name { color: var(--faint); }
.rail .row .glyph { flex: none; width: 1ch; color: var(--muted); }
.rail .row.current .glyph { color: var(--accent); }
.rail .row .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
.rail .row .mark { flex: none; color: var(--accent); font-size: 12px; }
.rail .actions { display: flex; gap: 6px; margin: 14px 8px; flex-wrap: wrap; }
.block-page { overflow: auto; padding: 28px clamp(22px, 5vw, 88px) 60px; container-type: inline-size; }
.block-page h1 .text { font-size: 24px; font-weight: 700; line-height: 1.3; background: transparent; border: 0; padding: 0; color: var(--text); }
.block-page .content { max-width: 820px; margin: 0 auto; }
.walk { max-width: 1120px; margin: 0 auto; }
.block-page h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 4px; }
.block-page section { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.block-page .subtle { color: var(--muted); }
.block-page .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; align-items: center; }
.block-page .actions .push { margin-left: auto; }
.block-page .step-detail { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.block-page .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.block-page .fields .wide { grid-column: 1 / -1; }
.block-page .fields .text, .block-page .fields .md { font-size: 13px; }
.block-page .status { display: flex; gap: 4px; margin-top: 10px; }
.block-page .status button.active { color: var(--on-ink); background: var(--ink); }
.block-page .sources .insight { color: var(--muted); font-size: 12px; margin: 0 0 6px 2ch; }
.srcrow { display: flex; align-items: baseline; gap: 10px; }
.srcrow .path { border: 0; background: transparent; padding: 2px 0; color: var(--accent); text-align: left; }
.srcrow .path:hover { text-decoration: underline; }
.srcrow .ghost { font-size: 12px; line-height: 1.6; padding: 0 6px; color: var(--muted); }
@media (max-width: 680px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .workspace .rail { max-height: 24vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .block-page { padding: 18px 20px 60px; }
  .block-page .fields { grid-template-columns: 1fr; }
}
/* Inside, linked and code rows: one line each, the whole row is the link. */
.section-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
.move { display: flex; align-items: baseline; gap: 10px; width: calc(100% + 12px); margin: 0 -6px; border: 0; border-radius: 4px; background: transparent; padding: 3px 6px; text-align: left; }
.move:hover { background: var(--soft); }
.move .arrow { flex: none; width: 2ch; color: var(--faint); }
.move .glyph { flex: none; width: 1ch; color: var(--muted); }
.move .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.move .edge { color: var(--muted); white-space: nowrap; }
.move .cite { margin-left: auto; padding-left: 12px; color: var(--accent); font-size: 12px; white-space: nowrap; }
.move.dim .name { color: var(--faint); }
.walk-head { display: flex; align-items: center; gap: 8px; }
.walk-head .label { margin-right: auto; }
/* Focus diagram: the walked block as a readable card, its links and nesting drawn around it. */
.focus { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(320px, 2.4fr) minmax(140px, 1fr); grid-template-areas: ". up ." "in card out" ". down ."; margin-top: 12px; }
.f-up { grid-area: up; display: flex; flex-direction: column; align-items: center; }
.f-up .top { border: 0; background: transparent; color: var(--muted); padding: 0; }
.f-in, .f-out { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
.f-in { grid-area: in; } .f-out { grid-area: out; }
.f-item { display: flex; align-items: center; min-width: 0; }
.f-wire { flex: 1 0 32px; position: relative; height: 1px; background: var(--line-strong); }
.f-wire.forward::after, .f-wire.both::after { content: "▶"; position: absolute; right: -3px; top: -8px; font-size: 10px; color: var(--line-strong); }
.f-wire.both::before { content: "◀"; position: absolute; left: -3px; top: -8px; font-size: 10px; color: var(--line-strong); }
.f-wire .f-label { position: absolute; left: 4px; right: 8px; bottom: 3px; text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-wire.uses { background: none; height: 0; border-top: 1px dashed var(--line-strong); }
.rail .row .reuse { flex: none; color: var(--muted); font-size: 12px; }
.picker .rows { display: flex; flex-direction: column; overflow: auto; max-height: 50vh; }
.picker .rows button { text-align: left; border: 0; background: transparent; padding: 2px 6px; }
.picker .rows button:hover { background: var(--soft); }
.picker .rows button.on { color: var(--accent); }
.f-dir { display: none; }
.f-node { max-width: 100%; min-width: 0; text-align: left; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); padding: 5px 10px; line-height: 1.4; }
.f-node:hover { background: var(--soft); }
.f-node .glyph { color: var(--muted); margin-right: 6px; }
.f-node .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.f-node .cite { display: block; font-size: 11px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-node.dim .name { color: var(--faint); }
.f-node.cursor, .f-card.cursor { border-color: var(--accent); outline: 1px solid var(--accent); }
.f-card { grid-area: card; min-width: 0; border: 1px solid var(--line-strong); border-radius: 4px; padding: 14px 18px 16px; background: var(--bg); }
.f-card h1 { margin: 0 0 4px; }
.f-card .f-status { display: block; color: var(--accent); font-size: 12px; }
.f-card .cite { display: block; text-align: left; border: 0; background: transparent; padding: 0; color: var(--accent); }
.f-card .md, .f-card .text { margin-top: 10px; }
.f-card .uncited { color: var(--muted); margin: 0; }
.f-card .note { color: var(--body); margin: 10px 0 0; }
.f-vwire { width: 1px; height: 16px; background: var(--line-strong); align-self: center; }
.f-down { grid-area: down; display: flex; flex-direction: column; align-items: stretch; }
.f-kids-head { text-align: center; margin: 4px 0 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.f-kids { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
@container (max-width: 700px) {
  .focus { grid-template-columns: 1fr; grid-template-areas: "up" "card" "in" "out" "down"; row-gap: 10px; }
  .f-wire { flex: 0 0 auto; height: auto; background: none; order: -1; margin-right: 8px; }
  .f-wire.uses { border-top: 0; }
  .f-wire::before, .f-wire::after { content: none !important; }
  .f-wire .f-label { position: static; }
  .f-dir { display: inline; margin-right: 6px; color: var(--faint); }
  .f-vwire { display: none; }
}
.crumbline a { cursor: pointer; }
.crumbline a:hover { color: var(--text); text-decoration: underline; }
@media (min-width: 1100px) { body.reviewing .workspace, body.reviewing .screens { right: 540px; } }
.dump { margin-top: 22px; }

.node { position: absolute; background: var(--bg); border: 1px solid var(--line-strong); user-select: none; }
.node.selected { border-color: var(--accent); outline: 1px solid var(--accent); z-index: 3; }
.node.target { border-color: var(--accent); }
.node .head { display: flex; align-items: flex-start; gap: 6px; padding: 5px 10px 2px; cursor: grab; }
.node .glyph { color: var(--accent); cursor: pointer; flex: none; }
.node .title { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; white-space: normal; }
.node .title-edit { font-weight: 700; padding: 0 4px; }
.node .badge { flex: none; color: var(--faint); } .node .badge.unknown { color: var(--warn); } .node .badge.observed { color: var(--ok); }
.node .mark { flex: none; color: var(--accent); }
.node .inside { flex: none; color: var(--muted); cursor: pointer; }
.node .inside:hover { color: var(--accent); }
.node .desc { margin: 0 10px; color: var(--body); font-size: 12px; line-height: 18px; max-height: 18px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.node .desc.none { color: var(--faint); }
.node .port { position: absolute; top: 11px; width: 9px; height: 9px; background: var(--bg); border: 1px solid var(--line-strong); cursor: crosshair; }
.node .port.in { left: -5px; } .node .port.out { right: -5px; }
.node .port:hover, .node.selected .port { border-color: var(--accent); }
/* A selected node is still just text: no boxes, no labels — a faint placeholder when empty. */
.node .body { padding: 0 10px 8px; cursor: default; user-select: text; }
.text { display: block; width: 100%; margin: 0; padding: 1px 0; border: none; border-radius: 0; background: transparent; color: var(--body); font: 12px/1.5 var(--mono); resize: none; overflow: hidden; min-height: 0; }
.text:hover { background: var(--soft); }
.text:focus { background: transparent; outline: none; box-shadow: inset 0 -1px 0 var(--accent); }
.text::placeholder { color: var(--faint); }
.line { display: flex; gap: 6px; align-items: baseline; }
.line > .lead { flex: none; color: var(--faint); font-size: 12px; }
/* The body is markdown: paragraphs, lists, headings and code panels. Click it to edit the raw text. */
.md { color: var(--body); font-size: 12px; line-height: 1.5; cursor: text; padding: 1px 0; }
.md:hover { background: var(--soft); }
.md p { margin: 0 0 4px; }
.md .h { font-weight: 700; color: var(--text); margin: 4px 0 2px; }
.md ul { margin: 0 0 4px; padding: 0; list-style: none; }
.md li::before { content: "- "; color: var(--faint); }
.md li.task::before { content: none; }
.md .box { color: var(--faint); }
.md code { background: var(--card); border-radius: 3px; padding: 0 3px; font-size: 11.5px; }
.md .code { position: relative; margin: 4px 0 6px; background: var(--card); border-radius: 4px; }
.md .code pre { margin: 0; padding: 4px 8px 6px; font: 11.5px/1.45 var(--mono); color: var(--text); overflow-x: auto; white-space: pre; }
.md .code .lang { display: block; padding: 3px 8px 0; font-size: 10px; line-height: 1.4; color: var(--faint); }
.node .has-code { flex: none; color: var(--muted); font-size: 11px; }
.node .srcs { margin: 2px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.node .srcs li::before { content: "[>] "; color: var(--faint); }
.node .state { flex: none; color: var(--muted); font-size: 11px; }
.node .badge { cursor: pointer; }
/* Actions float above the selected node in one row; they never become part of the node. */
.toolbar { position: absolute; left: -1px; bottom: calc(100% + 6px); display: flex; gap: 2px; white-space: nowrap; background: var(--ink); padding: 2px; border-radius: 4px; }
.toolbar button { font-size: 12px; line-height: 1.7; padding: 0 8px; border: none; background: transparent; color: var(--on-ink); }
.toolbar button:hover { background: rgba(127,127,127,0.25); }
.toolbar button.danger { color: #ff6961; }
.toolbar kbd { font: 11px var(--mono); opacity: .55; margin: 0 0 0 5px; padding: 0; border: 0; color: inherit; }
.toolbar .sep { width: 1px; margin: 3px 2px; background: rgba(127,127,127,0.4); }

.edge-edit { position: absolute; display: flex; gap: 4px; transform: translate(-50%, -50%); z-index: 4; }
.edge-edit input { width: 22ch; }

/* Chrome: one bar on top and one status line at the bottom. The page sits between them;
   the map runs underneath both, and they stay solid so nothing reads through. */
:root { --top: 44px; --bottom: 30px; }
.hud { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 0 12px; z-index: 6; }
.hud.top { top: 0; min-height: var(--top); border-bottom: 1px solid var(--line); }
.hud.top .left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.hud.top .right { display: flex; align-items: center; gap: 4px; flex: none; }
.hud.top .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.hud.status { bottom: 0; height: var(--bottom); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.hud.status .message { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hud.status .message.error { color: var(--bad); }
.hud.status .message.note { color: var(--text); }
.hud.status .hint + .hint { margin-left: 14px; }
.hud.status button { font-size: 12px; line-height: 1.6; }
kbd { font: 11px/1.4 var(--mono); color: var(--text); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; margin-right: 5px; }
.hud .doc { border: 1px solid transparent; background: transparent; font-weight: 700; width: auto; max-width: 44ch; padding: 1px 4px; }
.hud .doc:hover { border-color: var(--line); }
.hud .purpose { position: relative; }
.hud .purpose > button { border: 1px solid var(--line); background: transparent; padding: 0 8px; }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 8; display: flex; flex-direction: column; min-width: 14ch; background: var(--bg); border: 1px solid var(--ink); padding: 4px; }
.menu button { text-align: left; background: transparent; border: none; }
.menu button.on { background: var(--ink); color: var(--on-ink); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: none; background: transparent; }
.seg button.on { background: var(--ink); color: var(--on-ink); }
.hud .muted { color: var(--muted); white-space: nowrap; }
.hud .dirty { color: var(--warn); white-space: nowrap; display: none; } .hud .dirty.on { display: inline; }
.hud .crumbs { display: flex; gap: 6px; white-space: nowrap; overflow: hidden; min-width: 0; }
.hud .crumbs a { color: var(--muted); cursor: pointer; text-decoration: underline; }
.hud .crumbs a.here { color: var(--text); text-decoration: none; cursor: default; }
.hud .chip { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.hud .zoom { color: var(--muted); min-width: 5ch; text-align: right; }
@media (max-width: 680px) {
  :root { --top: 84px; }
  .hud.top { flex-wrap: wrap; padding: 6px 8px; row-gap: 6px; }
  .hud.top .right { width: 100%; overflow-x: auto; }
  .hud.top .right button { flex: none; }
  .hud .doc { max-width: 45vw; }
  .hud.top .left .muted, .hud .chip, .hud.status .hint { display: none; }
}
/* Progress: a click waiting on the server, and the agent working on a request. */
.spin { display: inline-block; width: 1ch; color: var(--accent); }
.activity { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; max-width: 46ch; overflow: hidden; }
.activity .what { overflow: hidden; text-overflow: ellipsis; }
.activity .elapsed { color: var(--faint); }
.activity button { font-size: 12px; line-height: 1.6; padding: 0 6px; }
button.pending { cursor: progress; opacity: .75; }
body.busy, body.busy * { cursor: progress; }
.node.working { border-style: dashed; border-color: var(--accent); }
.start .working { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.start .working .spin { font-size: 16px; }
.message { color: var(--muted); } .message.error { color: var(--bad); }

.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; z-index: 5; }
.start h1 { font-size: 20px; margin: 0; }
.start .hint { color: var(--faint); font-size: 12px; }
.start .row { display: flex; gap: 8px; flex-wrap: wrap; }
.start .row select { width: auto; }

/* The one human gate: a full-height panel, the text before and after, Accept at its foot. */
.review { position: fixed; right: 0; top: var(--top); bottom: var(--bottom); width: min(540px, 100%); display: flex; flex-direction: column;
  background: var(--bg); border-left: 1px solid var(--ink); z-index: 7; }
.review > header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.review > header .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.review h3 { margin: 4px 0; font-size: 14px; }
.review .summary { color: var(--body); }
.review .body { flex: 1; overflow: auto; padding: 12px 16px; }
.review .body h4 { margin: 14px 0 4px; font-size: 13px; }
.review .body h4:first-child { margin-top: 0; }
.review .where { color: var(--muted); font-weight: 400; }
.review .field { margin: 6px 0 10px 12px; }
.review .field .name { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.review .diffline { white-space: pre-wrap; font-size: 12px; padding-left: 2ch; text-indent: -2ch; }
.review .diffline.ins { color: var(--syn-string); } .review .diffline.del { color: var(--bad); }
.review .diffline.ins::before { content: "+ "; } .review .diffline.del::before { content: "- "; }
.review .diffline.same { color: var(--faint); }
.review .error { color: var(--bad); }
.review > footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.review .hint { color: var(--faint); font-size: 12px; }

/* The workspace: a file tree on the left, a read-only viewer on the right. Both float over the page or map. */

.rail .row .drift, .drift-state { color: var(--warn); font-size: 12px; }

<body>
<div class="workspace" id="workspace"><nav class="rail" id="rail" aria-label="Building blocks"></nav><main class="block-page" id="blockPage"></main></div>
<div class="viewport" id="viewport" hidden>
  <div class="world" id="world"><svg class="edges" id="edges"></svg></div>
</div>
<div class="screens" id="screens" hidden></div>
<header class="hud top" id="topbar">
  <div class="left">
    <input class="doc" id="docTitle" title="Document title — click to rename" spellcheck="false">
    <div class="purpose" id="purposeWrap"><button type="button" id="purpose" title="What this document is for"></button><div class="menu" id="purposeMenu" hidden></div></div>
    <span class="muted" id="progress"></span>
    <span class="dirty" id="dirty" title="Edits are in memory until you save">● unsaved</span>
    <span class="crumbs" id="crumbs"></span>
  </div>
  <div class="right">
    <span class="activity" id="activity" hidden></span>
    <button class="ghost" id="undo" title="Undo (⌘Z)">Undo</button>
    <button class="ghost" id="redo" title="Redo (⇧⌘Z)">Redo</button>
    <span class="sep"></span>
    <button class="ghost" id="filesToggle" title="Files in this workspace (/)">Files</button>
    <button class="ghost" id="driftToggle" title="Check cited code against the diagram (D)">Drift</button>
    <button class="ghost" id="screensToggle" title="Every page and component, drawn (S)">Screens</button>
    <button class="ghost" id="mapToggle" title="Switch between the block page and the map (v)">Map</button>
    <button class="ghost" id="tidy" title="Lay this level out on the grid (T)" hidden>Tidy</button>
    <button class="ghost" id="fit" title="Fit to screen (F)" hidden>Fit</button>
    <span class="zoom" id="zoom"></span>
    <span class="sep"></span>

  </div>
</header>
<footer class="hud status" id="statusbar">
  <span class="message" id="message"></span>
  <button class="ghost" id="keysToggle" title="Keyboard shortcuts (?)"><kbd>?</kbd>shortcuts</button>
  <span class="chip" id="session" title="The OMP session this page edits"></span>
</footer>
<div class="start" id="start" hidden></div>
<section class="review" id="review" hidden></section>
<aside class="drawer files" id="files" hidden></aside>
<aside class="drawer viewer" id="viewer" hidden></aside>
<div class="modal-back" id="modal" hidden></div>
<div class="offline" id="offline">disconnected from the OMP session — run /diagram web again</div>
<script>
"use strict";
// One map cell is SX x SY world pixels, and a node covers the cells the terminal

let selectedEdge = null, preview = null, gesture = null, editTitleOf = null, editBodyOf = null, centerOn = null;

/** Tree-sitter answers for `path:line`, fetched once each. */
const insights = new Map();
const views = new Map(); // diagram id -> map pan and zoom, not document content
const $ = id => document.getElementById(id);
function choices(values, current, onPick) {
  return el("div", { class: "seg", role: "group" }, ...values.map(value => el("button", { type: "button", class: value === current ? "on" : "", text: value, onclick: () => { if (value !== current) onPick(value); } })));
}
function ask(text, yes, onYes) {
  confirming = true;
  const host = $("modal");
  const close = () => { confirming = false; host.hidden = true; host.replaceChildren(); };
  host.hidden = false;
  host.replaceChildren(el("div", { class: "modal", role: "dialog", "aria-label": text },
    el("h3", { text }),
    el("div", { class: "row" },

      el("button", { text: "Cancel", onclick: close }))));
}

  const node = document.createElement(tag);

    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) { if (value) node.addEventListener(key.slice(2), value); }

}

  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
  return node;
}

// ---------------------------------------------------------------- server
const BUSY_WORDS = { save: "saving", submit: "sending to the agent", accept: "applying", preview: "composing and ranking context", previewBatch: "composing and ranking context", submitBatch: "sending to the agent", tidy: "tidying", undo: "undoing", redo: "redoing", checkDrift: "checking drift", reanchor: "re-anchoring", recordBaseline: "recording baseline", stillTrue: "re-fingerprinting", lineRequest: "adding the block" };
let inFlight = 0, inFlightWord = "";
/** Every write goes through here. Resolves to { ok, status, data } and never throws. */

  const button = document.activeElement && document.activeElement.tagName === "BUTTON" ? document.activeElement : null;

  inFlightWord = BUSY_WORDS[body.op] || "working";
  document.body.classList.add("busy");
  renderActivity();
  let response;
  try {
    opCount += 1;
    response = await fetch("/api/op", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  } catch {
    $("offline").classList.add("on");
    response = null;
  } finally {
    inFlight -= 1;
    if (inFlight === 0) document.body.classList.remove("busy");
    if (button && button.isConnected) { button.classList.remove("pending"); button.disabled = false; const spin = button.querySelector(".spin"); if (spin) { spin.nextSibling && spin.nextSibling.remove(); spin.remove(); } }

  const data = await response.json().catch(() => ({}));
  opCount += 1;
  if (data.state) state = data.state;
  if (!response.ok && !data.needsSave) flash(data.error || ("request failed: " + response.status), true);

/** A message answers one action, then the status line goes back to the keys; errors stay a little longer. */
let messageTimer = 0;
function flash(text, isError) {
  message = text; messageIsError = isError;
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { message = ""; if (state) renderHud(); }, isError ? 15000 : 6000);
}

async function poll() {
  try {
    const url = "/api/state" + (state ? "?since=" + encodeURIComponent(state.version) : "");
    const issuedAt = opCount;
    const response = await fetch(url);
    $("offline").classList.toggle("on", !response.ok && response.status !== 204);
    // A poll issued before an op may answer after it: its state is older, so drop it.
    if (response.status === 200 && issuedAt === opCount) {
      const next = await response.json();
      if (issuedAt === opCount) {
        const followFocus = state && next.selected !== state.selected;
        state = next;
        if (followFocus && next.selected) centerOn = next.selected;
        render();
      }
    }
  } catch { $("offline").classList.add("on"); }
  setTimeout(poll, 500);
}

// ---------------------------------------------------------------- document
function currentDiagram() {
  if (!state || !state.document) return null;
  let diagram = state.document.root;
  for (const id of state.stack.slice(1)) {
    const owner = diagram.blocks.find(block => block.children && block.children.id === id);
    if (!owner) break;
    diagram = owner.children;
  }
  return diagram;
}
function selectedBlock() {
  const diagram = currentDiagram();
  return diagram && state.selected ? diagram.blocks.find(block => block.id === state.selected) || null : null;
}
function rectOf(block) {
  return { x: block.position.x * SX, y: block.position.y * SY, w: cardCols(block.title) * SX - GUTTER, h: CARD_ROWS * SY - GUTTER };
}
function view() {
  const diagram = currentDiagram();
  const key = diagram ? diagram.id : "-";
  if (!views.has(key)) views.set(key, { x: 60, y: 90, k: 1 });
  return views.get(key);
}
function toWorld(clientX, clientY) { const v = view(); return { x: (clientX - v.x) / v.k, y: (clientY - v.y) / v.k }; }
function applyView() {
  const v = view();
  $("world").style.transform = "translate(" + v.x + "px," + v.y + "px) scale(" + v.k + ")";
  const grid = 16 * v.k;
  $("viewport").style.backgroundSize = grid + "px " + grid + "px";
  $("viewport").style.backgroundPosition = v.x + "px " + v.y + "px";
  $("zoom").textContent = Math.round(v.k * 100) + "%";
  keepToolbarOnScreen();
}
/** A selected node near the right edge would push its toolbar off screen: slide the toolbar back in. */
function keepToolbarOnScreen() {
  const bar = document.querySelector(".node.selected .toolbar");
  if (!bar) return;
  bar.style.left = "";
  const overflow = bar.getBoundingClientRect().right - (window.innerWidth - 8);
  if (overflow > 0) bar.style.left = -1 - overflow / view().k + "px";
}

  const active = document.activeElement;
  return !!active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT") && $("world").contains(active);
}

// ---------------------------------------------------------------- render
function render() {
  if (!state) return;
  renderHud();
  renderReview();
  renderFiles();
  renderViewer();
  renderStart();
  $("workspace").hidden = surface !== "page";
  $("viewport").hidden = surface !== "map";
  $("screens").hidden = surface !== "screens";
  $("mapToggle").textContent = surface === "map" ? "Page" : "Map";
  $("screensToggle").textContent = surface === "screens" ? "Page" : "Screens";
  $("zoom").hidden = surface !== "map";
  $("tidy").hidden = $("fit").hidden = surface !== "map";
  if (surface === "page") {
    const active = document.activeElement;
    renderRail();
    if (walking()) renderWalk();
    else if (!($("workspace").contains(active) && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName))) renderWorkspace();

    if (!editing() && !gesture) renderCanvas();
  } else renderScreens();
  if (driftOpen) renderDriftPanel();
}
/** Brainstorm is always a walk. Explore walks until a block is settled; plan stays a page. */
function walking() {
  const doc = state && state.document;
  if (!doc || surface !== "page") return false;
  if (doc.purpose === "brainstorm") return true;
  if (doc.purpose !== "explore") return false;
  const block = selectedBlock();
  return !block || block.status === "open";
}
function citationOf(block) {
  const source = block.sources && block.sources[0];

function uncited(block) { return state.document.purpose === "explore" && block.evidence !== "observed"; }
/** The block with this id anywhere in the tree, or null. */
function findBlock(id) {
  let found = null;
  if (!state.document) return null;
  const walk = diagram => { for (const block of diagram.blocks) { if (block.id === id) found = block; if (block.children) walk(block.children); } };

}
/**

function focusLists() {
  const focus = state.flow.focus;
  const shownBlock = id => { const found = findBlock(id); return found && shown(found) ? found : null; };

    parent: focus.parent ? findBlock(focus.parent) : null,
    inputs: focus.inputs.map(link).filter(candidate => candidate.block),

    return { slot, index };

    if (move === "up") return step("up", 1);
    if (move === "down") return step("down", 1);
    if (move === "left") return step("in", 1);
    return step("out", 1);

  if (current.slot === "in") {
    if (move === "left") return current;
    if (move === "right") return FOCUS_CENTER;
    return step("in", move === "up" ? -1 : 1);
  }
  if (current.slot === "out") {
    if (move === "right") return current;
    if (move === "left") return FOCUS_CENTER;
    return step("out", move === "up" ? -1 : 1);
  }

    if (move === "down") return current;
    if (move === "up") return FOCUS_CENTER;

function cursorNow(lists) { return focusCursor.for !== state.selected ? FOCUS_CENTER : normalizeFocusCursor(focusCursor, focusCounts(lists)); }
/** The block the cursor points at, or null on the centre. */

  if (cursor.slot === "up") return cursor.index === 0 ? lists.parent : null;
  if (cursor.slot === "in") return (lists.inputs[cursor.index] || { block: null }).block;
  if (cursor.slot === "out") return (lists.outputs[cursor.index] || { block: null }).block;
  if (cursor.slot === "down") return lists.children[cursor.index] || null;

    gesture = { kind: "pan", sx: event.clientX, sy: event.clientY, x: v.x, y: v.y, moved: false };
    $("viewport").classList.add("panning");
  }
  $("viewport").setPointerCapture(event.pointerId);
});
$("viewport").addEventListener("pointermove", event => {
  if (!gesture) return;
  const v = view();
  if (gesture.kind === "pan") {
    v.x = gesture.x + event.clientX - gesture.sx; v.y = gesture.y + event.clientY - gesture.sy;
    gesture.moved = gesture.moved || Math.abs(event.clientX - gesture.sx) + Math.abs(event.clientY - gesture.sy) > 3;
    applyView();
  } else if (gesture.kind === "move") {
    const dx = (event.clientX - gesture.sx) / v.k, dy = (event.clientY - gesture.sy) / v.k;
    if (Math.abs(dx) + Math.abs(dy) > 3) gesture.moved = true;
    gesture.node.style.left = gesture.left + dx + "px";
    gesture.node.style.top = gesture.top + dy + "px";
  } else if (gesture.kind === "wire") {
    const end = toWorld(event.clientX, event.clientY);
    gesture.wire.setAttribute("d", curve(gesture.start, end));
    for (const node of document.querySelectorAll(".node.target")) node.classList.remove("target");
    const over = document.elementFromPoint(event.clientX, event.clientY);
    const hovered = over && over.closest(".node");
    if (hovered && hovered.getAttribute("data-id") !== gesture.from) hovered.classList.add("target");
  }
});
$("viewport").addEventListener("pointerup", async event => {
  const done = gesture;
  gesture = null;
  $("viewport").classList.remove("panning");
  if (!done) return;
  if (done.kind === "pan") {
    if (!done.moved) { selectedEdge = null; if (state.selected) await op({ op: "focus", id: null }); else render(); }
    return;
  }
  if (done.kind === "wire") {
    done.wire.remove();
    for (const node of document.querySelectorAll(".node.target")) node.classList.remove("target");
    const over = document.elementFromPoint(event.clientX, event.clientY);
    const hovered = over && over.closest(".node");
    const to = hovered && hovered.getAttribute("data-id");
    if (to && to !== done.from) {
      const result = await op({ op: "addEdge", from: done.from, to, label: "" });
      const diagram = currentDiagram();
      const edge = result.ok && diagram ? diagram.edges.at(-1) : null;
      if (edge) { selectedEdge = edge.id; renderCanvas(); applyView(); const input = document.querySelector(".edge-edit input"); if (input) input.focus(); }
    } else render();
    return;
  }
  selectedEdge = null;
  if (done.moved) {
    await op({ op: "moveBlock", id: done.id, x: Math.max(0, Math.round(parseFloat(done.node.style.left) / SX)), y: Math.max(0, Math.round(parseFloat(done.node.style.top) / SY)) });
  }
  if (state.selected !== done.id) await op({ op: "focus", id: done.id });
  else if (!done.moved) render();
});
$("viewport").addEventListener("click", event => {
  const block = (() => { const node = event.target.closest && event.target.closest(".node"); if (!node) return null; const diagram = currentDiagram(); return diagram.blocks.find(b => b.id === node.getAttribute("data-id")); })();
  if (!block) return;
  if (event.target.classList.contains("glyph")) stepStatus(block);
  else if (event.target.classList.contains("inside")) op({ op: "enter", id: block.id });
  else if (event.target.classList.contains("badge")) {
    const order = ["observed", "inferred", "unknown"];
    op({ op: "patchBlock", id: block.id, fields: { evidence: order[(order.indexOf(block.evidence) + 1) % order.length] } });
  }
});
$("viewport").addEventListener("dblclick", event => {
  // Pointer capture retargets click events to the viewport, so hit-test by position.
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  if (!state || !state.document || !hit || hit.closest("input, textarea, select, button, .edge-edit, .body, .hud, .start, .review")) return;
  const nodeEl = hit.closest(".node");
  if (nodeEl) {
    if (hit.classList.contains("title")) { editTitleOf = nodeEl.getAttribute("data-id"); renderCanvas(); applyView(); }
    return;
  }
  addAt(toWorld(event.clientX, event.clientY));
});
$("viewport").addEventListener("wheel", event => {
  event.preventDefault();
  const v = view();
  if (event.ctrlKey || event.metaKey) {
    // Pinch or ctrl-wheel zooms about the pointer.
    const before = toWorld(event.clientX, event.clientY);
    v.k = Math.max(0.3, Math.min(2, v.k * Math.exp(-event.deltaY * 0.01)));
    v.x = event.clientX - before.x * v.k;
    v.y = event.clientY - before.y * v.k;
  } else {
    v.x -= event.deltaX; v.y -= event.deltaY;
  }
  applyView();
}, { passive: false });

// ---------------------------------------------------------------- chrome and keys
$("undo").addEventListener("click", () => op({ op: "undo" }));
$("redo").addEventListener("click", () => op({ op: "redo" }));
$("save").addEventListener("click", () => op({ op: "save" }));
$("purpose").addEventListener("click", event => { event.stopPropagation(); purposeOpen = !purposeOpen; render(); });
document.addEventListener("click", () => { if (purposeOpen) { purposeOpen = false; render(); } });
$("tidy").addEventListener("click", async () => { await op({ op: "tidy" }); fit(); });
$("fit").addEventListener("click", fit);
function toggleMap() { surface = surface === "map" ? "page" : "map"; render(); if (surface === "map") fit(); }
$("mapToggle").addEventListener("click", toggleMap);
$("screensToggle").addEventListener("click", toggleScreens);
$("driftToggle").addEventListener("click", () => { if (state && state.document) openDrift(); });
$("filesToggle").addEventListener("click", () => { filesOpen = !filesOpen; if (filesOpen) loadFiles(); render(); });
$("keysToggle").addEventListener("click", () => { if (keysOpen) { keysOpen = false; $("modal").hidden = true; } else openKeys(); });
$("docTitle").addEventListener("keydown", event => { if (event.key === "Enter" || event.key === "Escape") event.target.blur(); });
$("docTitle").addEventListener("change", () => { const title = $("docTitle").value.trim(); if (title) op({ op: "patchDocument", title }); });
window.addEventListener("resize", () => state && render());
document.addEventListener("keydown", event => {
  const target = event.target;
  const typing = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT");
  const mod = event.metaKey || event.ctrlKey;
  if (mod && event.key.toLowerCase() === "s") { event.preventDefault(); op({ op: "save" }); return; }
  if (event.key === "Escape" && pickerOpen) { closePicker(); return; }
  if (event.key === "Escape" && keysOpen) { keysOpen = false; $("modal").hidden = true; return; }
  if (event.key === "Escape" && mockupOpen) { closeMockup(); return; }
  if (event.key === "Escape" && goalOpen) { closeGoal(); return; }
  if (event.key === "Escape" && driftOpen) { closeDrift(); return; }
  if (event.key === "Escape" && (preview || confirming)) { if (confirming) { confirming = false; } closeModal(); return; }
  if (event.key === "Escape" && purposeOpen) { purposeOpen = false; render(); return; }
  if (event.key === "Escape" && viewer && !typing) { viewer = null; renderViewer(); return; }
  if (event.key === "Enter" && preview && !typing && !confirming) {
    event.preventDefault();
    if (preview.batch) submitBatchVerb(preview.verb, preview.ids); else submitVerb(preview.verb, preview.id);
    return;
  }
  if (event.key === "/" && !typing) { event.preventDefault(); filesOpen = true; loadFiles(); render(); requestAnimationFrame(() => { const input = document.querySelector("#files input"); if (input) input.focus(); }); return; }
  if (event.key === "?" && !typing) { event.preventDefault(); if (keysOpen) { keysOpen = false; $("modal").hidden = true; } else if (state) openKeys(); return; }
  if (typing || preview || keysOpen || pickerOpen || mockupOpen || goalOpen || driftOpen) return;
  if (mod && event.key.toLowerCase() === "z") { event.preventDefault(); op({ op: event.shiftKey ? "redo" : "undo" }); return; }
  if (mod || !state || !state.document) return;
  const block = selectedBlock();
  const verb = state.flow.verbs.find(candidate => candidate.key === event.key);
  if (verb) { event.preventDefault(); if (block) openPreview(verb.id, block.id); return; }
  switch (event.key) {
    case "ArrowLeft": case "ArrowRight": case "ArrowUp": case "ArrowDown": {
      if (surface !== "page" || !walking()) return;
      event.preventDefault();
      const lists = focusLists();
      focusCursor = { for: state.selected, ...moveFocusCursor(cursorNow(lists), event.key.slice(5).toLowerCase(), focusCounts(lists)) };
      renderWalk();
      return;
    }
    case "Escape":
      if (surface === "page" && walking() && cursorNow(focusLists()).slot !== "center") {
        focusCursor = { for: state.selected, ...FOCUS_CENTER };
        renderWalk();
        return;
      }
      if (surface === "map" || surface === "screens") { surface = "page"; render(); return; }
      if (selectedEdge) { selectedEdge = null; render(); return; }
      if (block) { op({ op: "focus", id: null }); return; }
      if (state.stack.length > 1) op({ op: "navigate", diagramId: state.stack[state.stack.length - 2] });
      return;
    case "Enter":
      if (surface === "map" && block) { op({ op: "enter", id: block.id }); return; }
      if (surface === "page" && walking()) {
        const lists = focusLists();
        const target = cursorTarget(cursorNow(lists), lists);
        if (target) { op({ op: "focus", id: target.id }); return; }
        if (block && block.sources && block.sources[0]) { openFile(block.sources[0].path, block.sources[0].startLine); return; }
        if (block) { editBodyOf = block.id; renderWalk(); }
      }
      return;
    case " ": event.preventDefault(); if (block) stepStatus(block); return;
    case "n": if (state.flow.nextOpen) { centerOn = state.flow.nextOpen; op({ op: "focus", id: state.flow.nextOpen }); } return;
    case "j": case "k": {
      // Depth-first, the order of the outline beside the page; grounded skips what it hides.
      const ids = [];
      const walk = diagram => { for (const item of diagram.blocks) { if (shown(item)) ids.push(item.id); if (item.children) walk(item.children); } };
      walk(state.document.root);
      if (ids.length) {
        const index = ids.indexOf(state.selected);
        const next = index === -1 ? (event.key === "j" ? 0 : ids.length - 1) : (index + (event.key === "j" ? 1 : ids.length - 1)) % ids.length;
        centerOn = ids[next];
        op({ op: "focus", id: ids[next] });
      }
      return;
    }
    case "v": toggleMap(); return;
    case "S": toggleScreens(); return;
    case "D": openDrift(); return;
    case "m": if (state.selected) toggleMark(state.selected); else { flash("select a block first", true); render(); } return;
    case "U": if (block) openUsesPicker(block); return;
    case "M": if (block && state.flow.extractTargets.length) openExtract(block); return;
    case "g": if (state.document.purpose === "explore") { grounded = !grounded; render(); } return;
    case "o": if (walking() && state.document.purpose === "brainstorm") { const dump = document.querySelector("#dump"); if (dump) dump.focus(); return; } op(block ? { op: "addBlock", afterId: block.id } : { op: "addBlock" }).then(r => { if (r.ok && surface === "map") { editTitleOf = state.selected; renderCanvas(); } }); return;
    case "O": if (block) op({ op: "addBlock", parentId: block.id }).then(r => { if (r.ok && surface === "map") { editTitleOf = state.selected; renderCanvas(); } }); return;
    case "T": if (surface === "map") op({ op: "tidy" }).then(fit); return;
    case "F": case "f": if (surface === "map") fit(); return;
    case "F2": if (block && surface === "map") { editTitleOf = block.id; renderCanvas(); } return;
    case "Delete": case "Backspace":
      if (selectedEdge) { const id = selectedEdge; selectedEdge = null; op({ op: "removeEdge", id }); return; }
      if (block) removeBlock(block);
      else if (state.stack.length > 1 && event.key === "Backspace") op({ op: "navigate", diagramId: state.stack[state.stack.length - 2] });
      return;
  }
});
poll();
</script>
