<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visual planner</title>
<!-- Built by scripts/build-web.ts from web/; edit the sources and rebuild. -->
<style>
/* OpenCode DESIGN.md: one monospace face, cream canvas and near-black ink, 1px hairlines,
   4px radius on controls and 0 on containers, no shadows, ASCII markers, blue only for state. */
:root {
  --bg: #fdfcfc; --soft: #f8f7f7; --card: #f1eeee; --line: rgba(15,0,0,0.12); --line-strong: #646262;
  --text: #201d1d; --body: #424245; --muted: #646262; --faint: #9a9898;
  --ink: #201d1d; --ink-deep: #0f0000; --on-ink: #fdfcfc;
  --accent: #007aff; --accent-soft: rgba(0,122,255,0.08);
  --ok: #30d158; --warn: #cc7f08; --bad: #d70015;
  --mono: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --top: 40px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #201d1d; --soft: #302c2c; --card: #302c2c; --line: rgba(253,252,252,0.12); --line-strong: #646262;
    --text: #fdfcfc; --body: #d9d6d6; --muted: #9a9898; --faint: #6e6e73;
    --ink: #fdfcfc; --ink-deep: #f1eeee; --on-ink: #201d1d;
    --accent-soft: rgba(0,122,255,0.16); --warn: #ff9f0a; --bad: #ff3b30;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.5 var(--mono); }
button { font: 500 13px/1.8 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 10px; cursor: pointer; }
button:active:not(:disabled) { background: var(--card); }
button:disabled { color: var(--faint); background: var(--card); border-color: var(--line); cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.subtle { color: var(--muted); }

/* Header: which tree, how far along, when it was read. */
.top { position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 5; white-space: nowrap; }
.top .root { font-weight: 700; }
.top .error { color: var(--bad); white-space: normal; }
.top .push { flex: 1; }

.main { position: fixed; inset: var(--top) 0 0 0; display: flex; }

/* The canvas: the whole tree as nested boxes, panned and zoomed by d3-zoom. */
.canvas { position: relative; flex: 1; min-width: 0; overflow: hidden; cursor: default;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas .box { position: absolute; border: 1px dashed var(--line-strong); background: var(--bg); cursor: pointer; overflow: hidden; }
.canvas .box.odd { background: var(--soft); }
.canvas .box.settled, .canvas .box.done { border-style: solid; }
.canvas .box.done .head { color: var(--faint); }
.canvas .box.selected { border: 2px solid var(--accent); }
.canvas .box .head { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 8px; white-space: nowrap; user-select: none; }
.canvas .box.parent .head { font-weight: 700; }
.canvas .box .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.canvas .box .glyph { flex: none; color: var(--muted); }
.canvas .box .twisty { flex: none; border: 0; background: transparent; padding: 0 2px; line-height: 1.4; color: var(--muted); }
.canvas .box .more { flex: none; color: var(--muted); font-size: 12px; }
.canvas .box .badge { flex: none; color: var(--muted); }
.canvas .box .badge.bad { color: var(--bad); font-weight: 700; }
svg.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wire line { stroke: var(--line-strong); stroke-width: 1.25; }
.wire.on line { stroke: var(--accent); stroke-width: 2; }
.wire text { fill: var(--muted); font: 12px var(--mono); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.wire.on text { fill: var(--accent); }
path.arrow { fill: var(--line-strong); }
path.arrow-on { fill: var(--accent); }

/* The selected node's page. */
.page { flex: none; width: min(440px, 45vw); overflow: auto; border-left: 1px solid var(--line); background: var(--bg); padding: 16px 18px 40px; }
.page .file { color: var(--muted); font-size: 12px; user-select: text; word-break: break-all; }
.page h1 { font-size: 20px; line-height: 1.3; margin: 6px 0 4px; }
.page .status { color: var(--muted); }
.page .problems { color: var(--bad); margin: 8px 0 0; padding-left: 2ch; }
.page section { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.page .source { color: var(--body); font-size: 12px; }
.page .link { display: block; width: 100%; text-align: left; border: 0; border-radius: 4px; background: transparent; padding: 1px 6px; margin: 0 -6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page .link:hover { background: var(--soft); color: var(--accent); }
.page .preview { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 8px; }
.section-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }

/* Markdown: paragraphs, lists, headings and code panels, rendered as text. */
.md { color: var(--body); font-size: 12px; line-height: 1.5; padding: 1px 0; }
.md p { margin: 0 0 4px; }
.md .h { font-weight: 700; color: var(--text); margin: 4px 0 2px; }
.md ul { margin: 0 0 4px; padding: 0; list-style: none; }
.md li::before { content: "- "; color: var(--faint); }
.md li.task::before { content: none; }
.md .box { color: var(--faint); }
.md code { background: var(--card); border-radius: 3px; padding: 0 3px; font-size: 11.5px; }
.md .code { position: relative; margin: 4px 0 6px; background: var(--card); border-radius: 4px; }
.md .code pre { margin: 0; padding: 4px 8px 6px; font: 11.5px/1.45 var(--mono); color: var(--text); overflow-x: auto; white-space: pre; }
.md .code .lang { display: block; padding: 3px 8px 0; font-size: 10px; line-height: 1.4; color: var(--faint); }

/* Mockups: a sandboxed frame drawn at 1280×800 and scaled into its box; no scripts, no same-origin access. */
.mockup-box { overflow: hidden; border: 1px solid var(--line); background: #fff; max-width: 100%; flex: none; }
.mockup-box iframe { display: block; }
.full { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(15,0,0,0.55); }
.full-body { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

.offline { position: fixed; inset: auto 0 0 0; background: var(--bad); color: #fdfcfc; text-align: center; padding: 4px; font-weight: 700; display: none; z-index: 20; }
.offline.on { display: block; }
</style>
</head>
