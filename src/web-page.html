.review > footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.review .hint { color: var(--faint); font-size: 12px; }

/* The workspace: a file tree on the left, a read-only viewer on the right. Both float over the page or map. */
.drawer { position: fixed; top: calc(var(--top) + 8px); bottom: calc(var(--bottom) + 8px); background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; z-index: 6; }
.drawer.files { left: 12px; width: 300px; }
.drawer.viewer { right: 12px; width: min(860px, 58vw); z-index: 8; }
.drawer .bar .meta { color: var(--faint); font-size: 12px; white-space: nowrap; }
.drawer .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.drawer .bar .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.drawer .bar button { font-size: 12px; line-height: 1.6; padding: 0 6px; }
.drawer .scroll { flex: 1; overflow: auto; }
.tree .item { display: flex; gap: 6px; padding: 0 8px; white-space: nowrap; cursor: pointer; font-size: 12px; line-height: 1.8; color: var(--body); }
.tree .item:hover { background: var(--soft); }
.tree .item.dir { color: var(--muted); }
.tree .item.open { background: var(--accent-soft); color: var(--text); }
.tree .item.mine .fname { color: var(--accent); }
.tree .item .fname { overflow: hidden; text-overflow: ellipsis; }
.tree .item .cites { margin-left: auto; color: var(--faint); }
.tree .note { padding: 6px 8px; color: var(--faint); font-size: 12px; }
.viewer .who { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
.viewer .who button { font-size: 12px; line-height: 1.6; padding: 0 6px; }
.viewer .who .none { color: var(--faint); }
.viewer table { border-collapse: collapse; width: 100%; font: 12px/1.5 var(--mono); tab-size: 4; }
.viewer td.n { width: 1%; padding: 0 8px 0 6px; text-align: right; color: var(--faint); user-select: none; cursor: pointer; }
.viewer td.t { white-space: pre; padding-right: 12px; color: var(--body); }
/* Syntax colors: the design's semantic ramp as highlight stand-ins, as its TUI mockup uses them. */
:root { --syn-keyword: #007aff; --syn-string: #248a3d; --syn-number: #d70015; --syn-type: #b25000; }
@media (prefers-color-scheme: dark) { :root { --syn-keyword: #0a84ff; --syn-string: #30d158; --syn-number: #ff6961; --syn-type: #ff9f0a; } }
.tk-keyword { color: var(--syn-keyword); }
.tk-string { color: var(--syn-string); }
.tk-number { color: var(--syn-number); }
.tk-type { color: var(--syn-type); }
.tk-function { color: var(--text); font-weight: 700; }
.tk-comment { color: var(--faint); }
.tk-operator, .tk-punctuation { color: var(--muted); }
.tk-variable { color: var(--text); }
.viewer tr.cited td { background: rgba(127,127,127,0.12); }
.viewer tr.mine td { background: var(--accent-soft); }
.viewer tr.mine td.n { color: var(--accent); }
.viewer tr.sel td { background: rgba(0,122,255,0.28); }
.viewer .ident { cursor: pointer; }
.viewer .ident:hover { text-decoration: underline; }
.viewer .intel { max-height: 40%; overflow: auto; border-bottom: 1px solid var(--line); padding: 6px 8px; font-size: 12px; }
.viewer .intel pre { white-space: pre-wrap; margin: 4px 0; }
.viewer .intel pre.hover-code { background: var(--soft); padding: 4px 6px; }
.viewer .intel p.hover-text { white-space: pre-wrap; margin: 4px 0; color: var(--body); }
.viewer .intel hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.viewer .intel .head { display: flex; align-items: center; gap: 6px; }
.viewer .intel .head .name { flex: 1; font-weight: 700; }
.viewer .intel button.loc { display: flex; align-items: baseline; gap: 1ch; width: 100%; text-align: left; border: 0; background: transparent; padding: 1px 4px; font-size: 12px; white-space: pre; overflow: hidden; }
.viewer .intel button.loc:hover { background: var(--soft); }
.viewer .intel .tree { flex: none; color: var(--faint); margin-right: -1ch; }
.viewer .intel .kind { flex: none; width: 6ch; color: var(--muted); }
.viewer .intel .sym { flex: 0 1 auto; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.viewer .intel .sym-row .ln { margin-left: auto; }
.viewer .intel .ln { flex: none; color: var(--faint); text-align: right; }
.viewer .intel .preview { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.viewer .intel .file-head { display: flex; gap: 1ch; margin: 6px 0 2px; font-weight: 700; }
.viewer .intel .file-head .count { color: var(--muted); font-weight: 400; }
.viewer .intel .section-head { margin: 10px 0 2px; }
.viewer .who .syntax { color: var(--muted); }
.rail .row .drift, .drift-state { color: var(--warn); font-size: 12px; }
.drift-panel .rows { overflow: auto; max-height: 55vh; display: flex; flex-direction: column; gap: 2px; }
.drift-panel .cite { display: flex; align-items: baseline; gap: 10px; font-size: 12px; }
.drift-panel .cite .path { color: var(--muted); white-space: nowrap; }
.drift-panel .cite button { font-size: 12px; line-height: 1.6; padding: 0 6px; }
.node .srcs li { cursor: pointer; }
.node .srcs li:hover { color: var(--accent); }

.modal-back { position: fixed; inset: 0; background: rgba(15,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { width: min(900px, calc(100% - 48px)); max-height: calc(100% - 64px); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--ink); padding: 14px; gap: 10px; }
.modal h3 { margin: 0; font-size: 13px; }
.modal pre { flex: 1; overflow: auto; margin: 0; padding: 12px 14px; background: var(--card); border-radius: 4px; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
.modal .note .text { font-size: 13px; color: var(--text); }
.modal .row { display: flex; gap: 8px; align-items: center; }
.modal .hint { color: var(--faint); font-size: 12px; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4px 28px; overflow: auto; }
.keys h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.keys .key { display: flex; gap: 10px; font-size: 12px; line-height: 1.9; }
.keys .key .k { flex: none; width: 12ch; }
.offline { position: fixed; inset: auto 0 0 0; background: var(--bad); color: #fdfcfc; text-align: center; padding: 4px; font-weight: 700; display: none; z-index: 20; }
.offline.on { display: block; }
/* Mockups: a sandboxed frame drawn at 1280×800 and scaled into its box; no scripts, no same-origin access. */
.mockup-box { overflow: hidden; border: 1px solid var(--line); background: #fff; max-width: 100%; flex: none; }
.mockup-box iframe { display: block; }
.mockup .row { display: flex; gap: 8px; margin-top: 8px; }
.mockup-diff { display: flex; gap: 12px; flex-wrap: wrap; }
.mockup-diff .side { display: flex; flex-direction: column; gap: 4px; }
/* Screens: every page and component on one board. */
.screens { position: fixed; inset: var(--top) 0 var(--bottom); overflow: auto; padding: 16px 24px; background: var(--bg); }
.screens .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin: 8px 0 24px; }
.screens .card { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 1px solid var(--line-strong); border-radius: 4px; padding: 10px; }
.screens .card pre { margin: 0; width: 320px; max-width: 100%; height: 200px; overflow: auto; padding: 6px 8px; background: var(--card); border-radius: 4px; font: 11px/1.4 var(--mono); white-space: pre; }
.screens .card .none { width: 320px; max-width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; color: var(--faint); border: 1px dashed var(--line); }
.screens .card .title { align-self: flex-start; border: 0; background: transparent; padding: 0; font-weight: 700; text-align: left; }
.screens .card .title:hover { color: var(--accent); }
.screens .card .where { color: var(--muted); font-size: 12px; }
.screens .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.screens .chips button, .screens .card .sketch { font-size: 12px; line-height: 1.6; padding: 0 6px; }
.screens .card .sketch { align-self: flex-start; }
/* Marks: blocks picked for a parallel batch. */
.rail .row .check { flex: none; color: var(--accent); }
.rail .batch { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 8px 10px; padding: 6px 8px; border: 1px solid var(--line); font-size: 12px; }
.rail .batch button { font-size: 12px; line-height: 1.6; padding: 0 6px; }
.rail .batch .subtle { color: var(--muted); }
.review .queue { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 4px; }
.review .queue button { font-size: 12px; line-height: 1.6; padding: 0 6px; }
</style>
